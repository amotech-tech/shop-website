<!DOCTYPE html>
<html>
<head>
  <title>Household Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Household Items Shop</h1>

<div class="container">

  <div class="product">
    <h3>Cooking Pot</h3>
    <p>KES 1500</p>
    <button onclick="addToCart('Cooking Pot',1500)">Add to Cart</button>
  </div>

  <div class="product">
    <h3>Broom</h3>
    <p>KES 300</p>
    <button onclick="addToCart('Broom',300)">Add to Cart</button>
  </div>

</div>

<h2>Cart</h2>
<ul id="cart"></ul>
<h3>Total: KES <span id="total">0</span></h3>

<a href="payment.html">
  <button class="checkout">Checkout</button>
</a>

<a href="payment.html">
  <button>Go to Payment</button>
</a>

<script src="script.js"></script>
</body>
</html>
